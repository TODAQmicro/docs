# This workflow does a clean install of node dependencies, builds the source code and runs tests on the Node version in .nvmrc
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Node.js CI

on:
  pull_request:
    branches:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Use Node.js from .nvmrc
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
    - run: "echo '//npm.pkg.github.com/:_authToken=${{ secrets.ROBOT_PAT }}' >> .npmrc"
    - run: npm ci
    - run: npm run build --if-present
    - run: npm run lint --if-present
    # The page checks (npm run test:e2e) drive Chromium against the built site.
    - run: npx playwright install --with-deps chromium
    - run: npm run test --if-present
